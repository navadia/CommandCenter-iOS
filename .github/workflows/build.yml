name: Build iOS app

# Every push to main builds an unsigned .ipa on a GitHub-hosted Mac and
# publishes it as the "latest" release, so the phone can always download
#   https://github.com/navadia/CommandCenter-iOS/releases/latest/download/CommandCenter.ipa
# SideStore signs it with your Apple ID when you install it.
# apps.json beside it is a SideStore source: add
#   https://github.com/navadia/CommandCenter-iOS/releases/download/latest/apps.json
# in SideStore > Sources once, and new builds show up there with an Update button.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Test the email parser
        run: |
          set -o pipefail
          swiftc App/Mail/EmailMessage.swift Tests/MailCheck/main.swift -o mailcheck 2>&1 | tee build.log
          ./mailcheck 2>&1 | tee -a build.log

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CommandCenter.xcodeproj \
            -scheme CommandCenter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.$(sed -nE 's/.*CURRENT_PROJECT_VERSION: "([0-9]+)".*/\1/p' project.yml)" \
            | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/CommandCenter.app

      - name: Embed entitlements and package .ipa
        run: |
          set -o pipefail
          scripts/package.sh 2>&1 | tee -a build.log

      - name: Write the SideStore source (apps.json)
        run: |
          BUILD=$(sed -nE 's/.*CURRENT_PROJECT_VERSION: "([0-9]+)".*/\1/p' project.yml)
          # SideStore refuses an update whose build number differs from the source's.
          APP=build/Build/Products/Release-iphoneos/CommandCenter.app
          for plist in "$APP/Info.plist" "$APP/PlugIns/CommandCenterWidget.appex/Info.plist"; do
            V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
            S=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
            echo "$plist: $S ($V)"
            test "$V" = "$BUILD" && test "$S" = "1.0.$BUILD"
          done
          SIZE=$(stat -f%z CommandCenter.ipa)
          NOTES=$(git log -1 --format=%s)
          BUILD="$BUILD" SIZE="$SIZE" NOTES="$NOTES" python3 scripts/source.py > apps.json
          cat apps.json

      - name: Publish the error log on failure (readable without Actions access)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          grep -nE "error:|fatal|Undefined symbol" build.log | head -80 > errors.txt || true
          tail -60 build.log >> errors.txt
          gh release delete build-failed --yes --cleanup-tag || true
          gh release create build-failed errors.txt build.log --prerelease \
            --title "Build failed ($(git rev-parse --short HEAD))" --notes-file errors.txt

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-failed --yes --cleanup-tag || true
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CommandCenter.ipa apps.json \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Built from $(git rev-parse --short HEAD). Open this page on your iPhone, download CommandCenter.ipa, then Share -> SideStore." \
            --latest
